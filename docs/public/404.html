<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 Not Found</title>
    <style>
        body {
            background: #f8f8f8;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
            color: #333;
        }
        .not-found {
            display: inline-block;
            padding: 40px 60px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .not-found h1 {
            font-size: 72px;
            margin: 0 0 20px 0;
            color: #e74c3c;
        }
        .not-found p {
            font-size: 20px;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="not-found">
        <h1>404</h1>
        <p>This content for the requested URL path is not found.</p>
    </div>
</body>
</html>
